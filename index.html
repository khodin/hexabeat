<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HexaBeat • Generative Hexagonal Rhythm Sequencer</title>
    <meta name="theme-color" content="#0a0a10" />
    <meta name="description" content="Generative 6-directional hexagonal rhythm sequencer inspired by JR Hexatone Pro, with procedural Web Audio synthesis." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- HEADER / TRANSPORT BAR -->
      <header class="header-bar">
        <div class="brand">
          <span class="brand-title">HexaBeat</span>
          <button id="btn-help" class="btn-help" title="Guide & Tutorial" aria-label="Tutorial">❓</button>
          <button id="btn-lang" class="btn-lang" title="Passer en Français" aria-label="Language Toggle">FR</button>
          <a href="https://github.com/khodin/hexabeat" target="_blank" rel="noopener noreferrer" class="github-btn" title="View Source on GitHub">
            <svg class="github-icon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </a>
        </div>

        <div class="transport-controls">
          <select id="preset-select" class="preset-select">
            <optgroup id="optgroup-presets" label="Presets">
              <option value="techno-drive">Techno Orbit</option>
              <option value="polyrhythm-orbit">Hex Polyrhythm</option>
              <option value="hiphop-groove">Boom Bap Hip Hop</option>
              <option value="trap-808">Trap 808</option>
              <option value="ambient-nexus">Melodic Nexus</option>
              <option value="acid-honeycomb">Acid Honeycomb</option>
              <option value="idm-generative">IDM Generative</option>
              <option value="blank">Empty Canvas</option>
            </optgroup>
            <optgroup id="optgroup-saved" label="Saved Projects"></optgroup>
          </select>

          <div class="tempo-box">
            <span class="tempo-label">BPM</span>
            <input type="range" id="bpm-slider" class="tempo-slider" min="60" max="220" value="128" />
            <span id="bpm-value" class="tempo-value">128</span>
          </div>

          <button id="btn-play" class="btn btn-primary" title="Start/Stop Sequencer">
            ▶ PLAY
          </button>
          <button id="btn-stop" class="btn btn-stop" title="Stop playback and return playheads to departure bays">
            ⏹ STOP
          </button>
          <button id="btn-clear" class="btn" title="Clear Grid">
            CLEAR
          </button>
          <button id="btn-share-project" class="btn btn-share" title="Share Project via Link / URL">
            🔗 SHARE
          </button>
          <button id="btn-save-project" class="btn btn-save" title="Save Project (Grid & Tempo)">
            💾 SAVE
          </button>
          <button id="btn-load-project" class="btn btn-load" title="Load / Manage Projects">
            📁 LOAD
          </button>
        </div>
      </header>

      <!-- MAIN HEXAGONAL CANVAS -->
      <main class="canvas-container">
        <canvas id="hex-canvas"></canvas>
      </main>

      <!-- BOTTOM STREAMLINED CONTROL & STATUS BAR -->
      <footer class="bottom-bar">
        <div class="status-left">
          <span id="selected-cell-info" class="status-chip">Tap cell to toggle beat</span>
        </div>
        <div id="cell-hud" class="cell-hud">
          <button id="btn-toggle-wall" class="btn btn-hud" title="Toggle impassable Wall Obstacle">
            🧱 Wall
          </button>
          <button id="btn-open-route" class="btn btn-hud btn-hud-route" title="Set Directional Routing">
            ↗ Route
          </button>
          <button id="btn-clear-route" class="btn btn-hud btn-hud-clear hidden" title="Remove routing arrow from cell">
            ✕ Clear
          </button>
        </div>
        <div class="status-right">
          <span id="step-indicator" class="status-chip">Step: 0</span>
        </div>
      </footer>
    </div>

    <!-- SAVE PROJECT MODAL -->
    <div id="modal-save" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-header">
          <h3 class="modal-title">💾 Save Project</h3>
          <button class="modal-close" id="btn-close-save-modal" title="Close">✕</button>
        </div>
        <div class="modal-body">
          <label for="project-name-input" class="modal-label">Project Name</label>
          <input type="text" id="project-name-input" class="modal-input" placeholder="e.g. Cyber Honeycomb" maxlength="32" autocomplete="off" />
          <div class="project-summary-box">
            <span>Tempo: <strong id="save-summary-bpm">128 BPM</strong></span>
            <span>Cells: <strong id="save-summary-cells">0 Configured</strong></span>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-share-modal" class="btn" title="Share project via URL">🔗 Share Link</button>
          <button id="btn-export-json" class="btn" title="Download project as a .json file">⬇ Export File</button>
          <button id="btn-confirm-save" class="btn btn-primary">Save Project</button>
        </div>
      </div>
    </div>

    <!-- LOAD / MANAGE PROJECTS MODAL -->
    <div id="modal-load" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-card-lg">
        <div class="modal-header">
          <h3 class="modal-title">📁 Project Manager</h3>
          <button class="modal-close" id="btn-close-load-modal" title="Close">✕</button>
        </div>
        <div class="modal-body">
          <div class="load-modal-toolbar">
            <span class="load-subtitle">Saved Grooves</span>
            <label class="btn btn-import" title="Import a project from a .json file">
              ⬆ Import File
              <input type="file" id="file-import-project" accept=".json,application/json" style="display: none;" />
            </label>
          </div>
          <div id="saved-projects-list" class="saved-projects-list">
            <!-- Dynamically populated -->
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-close-load" class="btn">Close</button>
        </div>
      </div>
    </div>

    <!-- ADVANCED ROUTING MODAL -->
    <div id="modal-route" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-card-sm">
        <div class="modal-header">
          <h3 class="modal-title">🧭 Route Direction</h3>
          <button class="modal-close" id="btn-close-route-modal" title="Close">✕</button>
        </div>
        <div class="modal-body">
          <p class="modal-desc">Direct playheads entering this cell along a compass path:</p>
          <div class="route-grid">
            <button class="btn-route-opt" data-dir="DIR_TL" title="Top-Left (NW)">
              <span class="route-arrow">↖</span> Top-Left
            </button>
            <button class="btn-route-opt" data-dir="DIR_TR" title="Top-Right (NE)">
              <span class="route-arrow">↗</span> Top-Right
            </button>
            <button class="btn-route-opt" data-dir="DIR_L" title="Left (W)">
              <span class="route-arrow">←</span> Left
            </button>
            <button class="btn-route-opt" data-dir="DIR_R" title="Right (E)">
              <span class="route-arrow">→</span> Right
            </button>
            <button class="btn-route-opt" data-dir="DIR_BL" title="Bottom-Left (SW)">
              <span class="route-arrow">↙</span> Bottom-Left
            </button>
            <button class="btn-route-opt" data-dir="DIR_BR" title="Bottom-Right (SE)">
              <span class="route-arrow">↘</span> Bottom-Right
            </button>
          </div>
          <div class="route-clear-container">
            <button id="btn-modal-clear-route" class="btn btn-remove-route" title="Remove routing arrow from cell">
              ✕ Remove Route
            </button>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-close-route" class="btn">Done</button>
        </div>
      </div>
    </div>

    <!-- TUTORIAL / GUIDE MODAL -->
    <div id="modal-tutorial" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <div class="modal-card modal-card-tut">
        <div class="modal-header">
          <h3 id="tutorial-modal-title" class="modal-title">🎓 HexaBeat Guide & Tutorial</h3>
          <button class="modal-close" id="btn-close-tutorial-modal" title="Close">✕</button>
        </div>
        <div class="tutorial-tabs" role="tablist">
          <button class="tutorial-tab active" data-index="0" id="tab-0">1. Concept</button>
          <button class="tutorial-tab" data-index="1" id="tab-1">2. Instruments</button>
          <button class="tutorial-tab" data-index="2" id="tab-2">3. Beats & Walls</button>
          <button class="tutorial-tab" data-index="3" id="tab-3">4. Routing</button>
          <button class="tutorial-tab" data-index="4" id="tab-4">5. Sharing</button>
        </div>
        <div id="tutorial-slide-body" class="tutorial-slide-body">
          <!-- Dynamic slide content populated by TutorialModal.ts -->
        </div>
        <div class="modal-footer tutorial-footer">
          <button id="btn-tutorial-prev" class="btn">← Previous</button>
          <div class="tut-footer-right">
            <button id="btn-tutorial-done" class="btn">Close</button>
            <button id="btn-tutorial-next" class="btn btn-primary">Next →</button>
          </div>
        </div>
      </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
